apiVersion: apps/v1
kind: Deployment
metadata:
 name: nginx-deployment
 labels:
  app: static-website
spec:
 replicas: 3
 selector:
  matchLabels:
   app: static-website
 template:
  metadata:
   labels:
    app: static-website
  spec:
    containers:
    - name: nginx-container
      image: nginx:latest