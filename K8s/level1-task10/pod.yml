apiVersion: v1
kind: Pod
metadata:
 name: time-check
 namespace: xfusion
spec:
 containers:
 - name: time-check
   image: busybox:latest
   env:
    - name: TIME_FREQ
      valueFrom:
        configMapKeyRef:
           name: time-config
           key: TIME_FREQ
   command: ["/bin/sh", "-c"]
   args:
    [
        
        "while true; do date >> /opt/itadmin/time/time-check.log; sleep $TIME_FREQ;done",]
   volumeMounts:
   - name: log-volume
     mountPath: /opt/itadmin/time
 volumes:
 - name: log-volume
   emptyDir: {}
