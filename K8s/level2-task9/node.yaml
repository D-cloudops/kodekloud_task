apiVersion: apps/v1
kind: Deployment
metadata:
 name: node-deployment-nautilus
 labels:
   app: node
spec:
 replicas: 2
 selector:
   matchLabels:
     app: node
 template:
  metadata:
   labels:
    app: node
  spec:
   containers:
   - name: node-container-nautilus
     image: gcr.io/kodekloud/centos-ssh-enabled:node
     ports:
     - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
 name: node-service-nautilus
spec:
 type: NodePort
 selector:
   app: node
 ports:
 - protocol: TCP
   port: 8080
   targetPort: 8080
   nodePort: 30012     