apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  labels:
    app: mysql
spec:
 replicas: 1
 selector:
   matchLabels:
    app: mysql
 template:
   metadata:
     labels:
       app: mysql
   spec:
    volumes:
    - name: pv-mysql
      persistentVolumeClaim:
        claimName: mysql-pv-claim
    containers:
    - name: mysql-container
      image: mysql:8.4
      volumeMounts:
      - name: pv-mysql
        mountPath: /var/lib/mysql
      env:
      - name: MYSQL_ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mysql-root-pass
            key: password
      - name: MYSQL_DATABASE
        valueFrom:
         secretKeyRef:
           name: mysql-db-url
           key: database
      - name: MYSQL_USER
        valueFrom:
         secretKeyRef:
           name: mysql-user-pass
           key: username
      - name: MYSQL_PASSWORD
        valueFrom:
         secretKeyRef:
           name: mysql-user-pass
           key: password