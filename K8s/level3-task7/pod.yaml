apiVersion: apps/v1
kind: Deployment
metadata:
  name: lemp-wp
  labels:
    app: lemp
spec:
  replicas: 1
  selector:
    matchLabels:
     app: lemp
  template:
   metadata:
    labels:
     app: lemp
   spec:
    volumes:
    - name: phpconfig
      configMap:
       name: php-config
    containers:
    - name: nginx-php-container
      image: webdevops/php-nginx:alpine-3-php7
      volumeMounts:
      - name: phpconfig
        mountPath: /opt/docker/etc/php/php.ini
        subPath: php.ini
      env:
      - name: MYSQL_ROOT_PASSWORD
        valueFrom:
         secretKeyRef:
           name: mysql-root-pass
           key: password
      - name: MYSQL_DATABASE
        valueFrom:
         secretKeyRef:
           name: mysql-db-url
           key: database
      - name: MYSQL_PASSWORD
        valueFrom:
         secretKeyRef:
           name: mysql-user-pass
           key: password
      - name: MYSQL_USER
        valueFrom:
         secretKeyRef:
           name: mysql-user-pass
           key: username
      - name: MYSQL_HOST
        valueFrom:
         secretKeyRef:
           name: mysql-host
           key: host
    - name: mysql-container
      image: mysql:5.6
      env:
      - name: MYSQL_ROOT_PASSWORD
        valueFrom:
         secretKeyRef:
           name: mysql-root-pass
           key: password
      - name: MYSQL_DATABASE
        valueFrom:
         secretKeyRef:
           name: mysql-db-url
           key: database
      - name: MYSQL_PASSWORD
        valueFrom:
          secretKeyRef:
           name: mysql-user-pass
           key: password
      - name: MYSQL_USER
        valueFrom:
          secretKeyRef:
           name: mysql-user-pass
           key: username
      - name: MYSQL_HOST
        valueFrom:
          secretKeyRef:
           name: mysql-host
           key: host