apiVersion: apps/v1
kind: Deployment
metadata:
 name: drupal-mysql
 labels:
  app: mysql
spec:
 replicas: 1
 selector:
  matchLabels:
    app: mysql
 template:
  metadata:
   labels:
     app: mysql
  spec:
   volumes:
   - name: mysql-data
     persistentVolumeClaim:
      claimName: drupal-mysql-pvc
   containers:
   - name: mysql-container
     image: mysql:5.7
     env:
     - name: MYSQL_ROOT_PASSWORD
       valueFrom:
        secretKeyRef:
         name: mysql-root-pass
         key: password
     volumeMounts:
     - name: mysql-data
       mountPath: /var/lib/mysql