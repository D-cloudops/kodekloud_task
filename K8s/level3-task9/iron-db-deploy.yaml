apiVersion: apps/v1
kind: Deployment
metadata:
  name: iron-db-deployment-devops
  namespace: iron-namespace-devops
  labels:
   db: mariadb
spec:
  replicas: 1
  selector:
   matchLabels:
    db: mariadb
  template:
    metadata:
     labels:
      db: mariadb
    spec:
     containers:
     - name: iron-db-container-devops
       image: kodekloud/irondb:2.0
       env:
       - name: MYSQL_DATABASE
         value: "database_blog"
       - name: MYSQL_ROOT_PASSWORD
         valueFrom:
           secretKeyRef:
             name: mysql-root-password
             key: password
       - name: MYSQL_PASSWORD
         valueFrom:
           secretKeyRef:
            name: mysql-user
            key: password
       - name: MYSQL_USER
         valueFrom:
           secretKeyRef:
             name: mysql-user
             key: user
       volumeMounts:
       - name: db
         mountPath: /var/lib/mysql
     volumes:
     - name: db
       emptyDir: {}