apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |-
     events {
        worker_connections 1024;
     }
     http {
        server {
            listen 8094;
            server_name localhost;

            location / {
                root /var/www/html;
                index index.htm index.php index.html;
            }
        }
      }