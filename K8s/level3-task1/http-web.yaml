apiVersion: apps/v1
kind: Deployment
metadata:
 name: httpd-deployment-xfusion
 namespace: httpd-namespace-xfusion
 labels:
   app: http
spec:
 replicas: 2
 selector:
   matchLabels:
     app: http
 template:
  metadata:
   labels:
    app: http
  spec:
   containers:
   - name: http-container-xfusion
     image: httpd:latest
     ports:
     - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
 name: httpd-service-xfusion
 namespace: httpd-namespace-xfusion
spec:
 type: NodePort
 selector:
   app: http
 ports:
 - protocol: TCP
   port: 80
   targetPort: 80
   nodePort: 30004