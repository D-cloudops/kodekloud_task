apiVersion: v1
kind: Pod
metadata:
 name: pod-xfusion
 labels:
  app: web
spec:
 volumes:
 - name: pvc-xfusion-pod
   persistentVolumeClaim:
     claimName: pvc-xfusion
 containers:
 - name: container-xfusion
   image: httpd:latest
   volumeMounts:
   - name: pvc-xfusion-pod
     mountPath: /usr/local/apache2/htdocs/


---

apiVersion: v1
kind: Service
metadata:
 name: web-xfusion
spec:
 type: NodePort
 selector:
   app: web
 ports:
 - port: 80
   targetPort: 80
   nodePort: 30008
   protocol: TCP