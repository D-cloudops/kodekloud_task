apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-slave
  labels:
   app: redis-slave
spec:
 replicas: 2
 selector:
   matchLabels:
     app: redis-slave
 template:
   metadata:
    labels:
      app: redis-slave
   spec:
    containers:
    - name: slave-redis-devops
      image: gcr.io/google_samples/gb-redisslave:v3
      resources:
       requests:
         cpu: "100m"
         memory: "100Mi" 
      env:
      - name: GET_HOSTS_FROM
        value: dns
      ports:
      - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
 name: redis-slave
spec:
 selector:
   app: redis-slave
 type: ClusterIP
 ports:
 - protocol: TCP
   port: 6379
   targetPort: 6379
